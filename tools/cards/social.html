<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Krub:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #fff; position: relative; font-family: "Krub", sans-serif; color: #1c1b1f; -webkit-font-smoothing: antialiased; }
  .copy { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); width: 640px; }
  h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 188px; line-height: 0.84; letter-spacing: -0.05em; }
  .verbs { display: inline-block; margin-top: 10px; padding-bottom: 16px; position: relative; font-family: "Bricolage Grotesque", sans-serif; font-weight: 650; font-size: 60px; letter-spacing: -0.03em; color: #684590; }
  .verbs::after { content: ""; position: absolute; left: 0; bottom: 0; width: 72%; height: 6px; border-radius: 3px; background: #7cb342; }
  p { margin: 30px 0 0; font-size: 30px; line-height: 1.35; color: #5f5c67; }
  .foot { margin-top: 34px; font-size: 22px; color: #8a8792; }
  .foot b { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; color: #684590; margin-right: 14px; }
  .art { position: absolute; right: 40px; top: 6px; height: 628px; }
</style>
</head>
<body>
  <div class="copy">
    <h1>nosh</h1>
    <div class="verbs">log. see. adjust.</div>
    <p>Nutrition tracking inside Obsidian,<br>built around DASH.</p>
    <div class="foot"><b>nosh.health</b> free and open source, for Obsidian</div>
  </div>
  <img class="art" src="card-block.svg" alt="">
</body>
</html>
